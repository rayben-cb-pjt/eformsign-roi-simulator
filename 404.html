<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>이동합니다 · eformsign 전자계약 ROI 시뮬레이터</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://eformsign-roi-simulator.vercel.app/">
<!-- JS 미동작 환경 폴백(쿼리스트링은 보존되지 않음) -->
<noscript><meta http-equiv="refresh" content="0; url=https://eformsign-roi-simulator.vercel.app/"></noscript>
<style>
  :root{color-scheme:only light}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#F2F9FF;color:#1A2B3C;text-align:center;padding:24px;
    font-family:"Pretendard","Malgun Gothic",system-ui,-apple-system,sans-serif;
    word-break:keep-all;line-height:1.6}
  .box{max-width:420px}
  img{height:26px;width:auto;margin:0 auto 22px;display:block}
  h1{font-size:19px;font-weight:700;margin:0 0 10px;letter-spacing:-.01em}
  p{margin:0 0 20px;font-size:14.5px;color:#4A5A6A}
  a{display:inline-block;background:#0E73C3;color:#fff;text-decoration:none;
    font-weight:700;font-size:15px;padding:13px 22px;border-radius:11px}
  a:hover{background:#0B5A99}
  .tiny{margin-top:16px;font-size:12px;color:#8195A6}
</style>
</head>
<body>
  <div class="box">
    <img src="eformsign_logo.png" alt="eformsign">
    <h1>새 주소로 이동합니다</h1>
    <p>전자계약 ROI 시뮬레이터가 새 주소로 옮겨졌습니다.<br>잠시 후 자동으로 이동합니다.</p>
    <a id="go" href="https://eformsign-roi-simulator.vercel.app/">지금 이동하기</a>
    <p class="tiny">eformsign-roi-simulator.vercel.app</p>
  </div>
<script>
(function(){
  // 옛 주소로 들어온 진단 딥링크(?contracts=...)를 그대로 넘겨 정상 동작시킨다.
  var base = 'https://eformsign-roi-simulator.vercel.app/';
  var target = base + (window.location.search || '') + (window.location.hash || '');
  var link = document.getElementById('go');
  if (link) { link.href = target; }
  // 뒤로가기로 이 페이지에 갇히지 않도록 replace 사용
  window.location.replace(target);
})();
</script>
</body>
</html>
